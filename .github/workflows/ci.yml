name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
      - run: go test ./...
        env:
          CGO_ENABLED: "0"
      - run: go vet ./...
        env:
          CGO_ENABLED: "0"
      - if: runner.os == 'macOS'
        run: scripts/build-host-macos.sh
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
      - if: runner.os == 'Linux'
        run: scripts/build-host-linux.sh
